name: "💌 Bạn gái nhắn tin"

# ═══════════════════════════════════════════════════════════════
# Lịch chạy: 4 lần mỗi ngày theo GIỜ VIỆT NAM (UTC+7)
#   08:00 VN = 01:00 UTC  → tin buổi sáng
#   13:00 VN = 06:00 UTC  → tin buổi trưa
#   18:00 VN = 11:00 UTC  → tin buổi chiều
#   23:00 VN = 16:00 UTC  → tin buổi tối (trước khi ngủ)
# Lưu ý: GitHub Actions đôi khi trễ lịch 5–15 phút — bình thường nhé!
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 sáng (giờ VN)
    - cron: "0 6 * * *"   # 13:00 trưa (giờ VN)
    - cron: "0 11 * * *"  # 18:00 chiều (giờ VN)
    - cron: "0 16 * * *"  # 23:00 tối (giờ VN)
  workflow_dispatch:      # nút "Run workflow" để chạy thử thủ công

permissions:
  contents: write         # cho phép bot tự commit nhật ký trò chuyện

concurrency:
  group: girlfriend-bot
  cancel-in-progress: false

jobs:
  nhantin:
    name: "💌 Bơ online nhắn tin cho anh yêu"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: "📥 Lấy code"
        uses: actions/checkout@v4

      - name: "🐍 Cài Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "📦 Cài thư viện"
        run: pip install -r requirements.txt

      - name: "💌 Bơ thức dậy, nhắn tin & trả lời anh"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Tùy chọn (đặt trong tab "Variables" nếu muốn đổi):
          NICKNAME: ${{ vars.NICKNAME }}         # em gọi anh là gì (mặc định: anh yêu)
          GIRL_NAME: ${{ vars.GIRL_NAME }}       # tên của em (mặc định: Bơ)
          POLL_MINUTES: ${{ vars.POLL_MINUTES }} # số phút online trả lời (mặc định: 10)
          MEMORY_LIMIT: ${{ vars.MEMORY_LIMIT }} # nhớ bao nhiêu tin (mặc định: 20)
        run: python src/main.py

      - name: "💾 Lưu nhật ký trò chuyện vào repo"
        run: |
          git config user.name "girlfriend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "Không có gì mới để lưu."
          else
            git commit -m "💌 Cập nhật nhật ký trò chuyện [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
